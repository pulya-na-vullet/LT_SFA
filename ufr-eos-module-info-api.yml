---
manifest:
  app:
    namespace: "ufr-eos-ul-ncins"
serviceName: "module-info-api"
serviceHost: lt.ufrulklt-api.moscow.alfaintra.net
profile: loading
cluster: "ufrulkltmaster1.moscow.alfaintra.net"
replicaCounter: 2
project:
  name: "ufr-eos-ul-ncins"
  service: "${project.name}-${serviceName}"
nodeSelector:
  node-role.kubernetes.io/node: ''
chartConfigMapFolder: "configMap"
podAdditionalLabels:
  networking.kubernetes.io/ufr-ui-loadbalancer: enabled
  networking.kubernetes.io/ufr-api-loadbalancer: enabled
  networking.kubernetes.io/ufr-ulk-api-loadbalancer: enabled
  networking.kubernetes.io/ufr-ulk-ui-loadbalancer: enabled
  networking.kubernetes.io/common-services: enabled
  networking.kubernetes.io/client-session: enabled
  networking.kubernetes.io/keycloak: enabled
serviceAdditionalLabels:
  tier: backend
configMap:
  - name: "${project.name}-${serviceName}"
    files:
      - "application.yml"
      - "${project.service}.yml"
containers:
  registry: eco.binary.alfabank.ru
  image: "ufr-eos-module-info-api"
  ports:
    - name: http
      protocol: TCP
      servicePort: 80
      containerPort: 8080
    - name: prometheus
      protocol: TCP
      servicePort: 8081
      containerPort: 8081
  secrets:
    - name: "alfabank-trustca-secret"
      mountPath: "/ssl/trustca"
      permissions: "444"
    - name: "ufr-truststore-jks"
      mountPath: "/data/ssl/CAs/"
      permissions: "420"
  envs:
    type: "java"
    enabledDefaults: true
  configMaps:
    - name: "${project.name}-${serviceName}"
      mountPath: /configs
  env:
    JAVA_OPTS: "-server -Xmx430M -Xms430M -XX:MaxMetaspaceSize=128M
                      -Djavax.net.ssl.trustStore=/data/ssl/CAs/ufrTrustStore.jks
                      -Djavax.net.ssl.trustStorePassword=
                      -Djavax.net.ssl.trustStoreType=JKS
                      -XX:+PrintFlagsFinal"
    SERVICE_HOST: "${serviceHost}"
    SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/configs/application.yml, file:/configs/${project.service}.yml"
    PROJECT_KEY: "${project.name}"
    SERVICE_NAME: "${project.service}"
    SPRING_APPLICATION_NAME: "${project.service}"
    SPRING_PROFILES_ACTIVE: "${profile},kubernetes"
    SPRING_CLOUD_CONFIG_ENABLED: "false"
    LOGGING_CONFIG: "classpath:logback.xml"
    TZ: "Europe/Moscow"
  resources:
    requests:
      memory: "614Mi"
      cpu: "10m"
    limits:
      memory: "740Mi"
      cpu: "240m"
  probes:
    startupProbe:
      httpGet:
        path: /actuator/health
        port: http
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 3
    livenessProbe:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 60
      failureThreshold: 5
      periodSeconds: 30
      timeoutSeconds: 3
    readinessProbe:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 30
      failureThreshold: 3
      periodSeconds: 20
      timeoutSeconds: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
  port: prometheus