---
manifest:
  app:
    namespace: "ufr-eos-ul-ncins"
serviceName: "core-api"
serviceHost: lt.ufrulklt-api.moscow.alfaintra.net
profile: loading
cluster: "ufrulkltmaster1.moscow.alfaintra.net"
replicaCounter: 2
project:
  name: "ufr-eos-ul-ncins"
  service: "${project.name}-${serviceName}"
nodeSelector:
  node-role.kubernetes.io/node: ''
chartConfigMapFolder: "configMap"
podAdditionalLabels:
  networking.kubernetes.io/mdm: enabled
  networking.kubernetes.io/keycloak: enabled
  networking.kubernetes.io/redis-keycloak: enabled
  networking.kubernetes.io/ufr-api-loadbalancer: enabled
  networking.kubernetes.io/role-model: enabled
  networking.kubernetes.io/business-event: enabled
  networking.kubernetes.io/ufr-ulk-api-loadbalancer: enabled
  networking.kubernetes.io/ufr-system: enabled
  networking.kubernetes.io/ump: enabled
  networking.kubernetes.io/kafka-sfa: enabled
  networking.kubernetes.io/sign-module: enabled
  networking.kubernetes.io/sign-online: enabled
  networking.kubernetes.io/alfacapture: enabled
  networking.kubernetes.io/obip: enabled
  networking.kubernetes.io/redis-common: enabled
  networking.kubernetes.io/client-session: enabled
  networking.kubernetes.io/common-services: enabled
serviceAdditionalLabels:
  tier: backend
configMap:
  - name: "${project.name}-${serviceName}"
    files:
      - "application.yml"
      - "${project.service}.yml"
containers:
  registry: eco.binary.alfabank.ru
  image: "ufr-eos-ul-ncins-core-api"
  ports:
    - name: http
      protocol: TCP
      servicePort: 80
      containerPort: 8080
    - name: prometheus
      protocol: TCP
      servicePort: 8081
      containerPort: 8081
  secrets:
    - name: "alfabank-trustca-secret"
      mountPath: "/ssl/trustca"
      permissions: "444"
    - name: "ufr-truststore-jks"
      mountPath: "/data/ssl/CAs/"
      permissions: "420"
  envs:
    type: "java"
    enabledDefaults: true
    envFrom:
      - secretRef:
          name: "redis-common"
      - secretRef:
          name: "redis-keycloak"
      - secretRef:
          name: "kafka-bank-wide"
      - secretRef:
          name: "keycloak"
      - secretRef:
          name: "obip"
      - secretRef:
          name: "alfa-capture"
      - secretRef:
          name: "sign-online"
      - secretRef:
          name: "ws"
  configMaps:
    - name: "${project.name}-${serviceName}"
      mountPath: /configs
  env:
    JAVA_OPTS: "-server -Xmx512M -Xms512M -XX:MaxMetaspaceSize=160M
                  -Djavax.net.ssl.trustStore=/data/ssl/CAs/ufrTrustStore.jks
                  -Djavax.net.ssl.trustStorePassword=
                  -Djavax.net.ssl.trustStoreType=JKS
                  -XX:+PrintFlagsFinal
                  -XX:+HeapDumpOnOutOfMemoryError
                  -XX:HeapDumpPath=/tmp/dump.hprof"
    SERVICE_HOST: "${serviceHost}"
    SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/configs/application.yml, file:/configs/${project.service}.yml"
    PROJECT_KEY: "${project.name}"
    SERVICE_NAME: "${project.service}"
    SPRING_APPLICATION_NAME: "${project.service}"
    SPRING_PROFILES_ACTIVE: "${profile},kubernetes"
    SPRING_CLOUD_CONFIG_ENABLED: "false"
    TZ: "Europe/Moscow"
  resources:
    requests:
      memory: "1024Mi"
      cpu: "90m"
    limits:
      memory: "1228Mi"
      cpu: "240m"
  probes:
    startupProbe:
      httpGet:
        path: /admin/health
        port: http
      failureThreshold: 60
      periodSeconds: 5
      timeoutSeconds: 3
    livenessProbe:
      httpGet:
        path: /admin/health/liveness
        port: http
      initialDelaySeconds: 60
      failureThreshold: 5
      periodSeconds: 30
      timeoutSeconds: 3
    readinessProbe:
      httpGet:
        path: /admin/health/readiness
        port: http
      initialDelaySeconds: 30
      failureThreshold: 3
      periodSeconds: 20
      timeoutSeconds: 3
prometheus:
  enabled: true
  path: /admin/prometheus
  port: prometheus