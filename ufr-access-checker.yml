---
manifest:
  app:
    namespace: "ufr-eos-ul-ncins"
serviceName: "access-checker"
serviceHost: lt.ufrulklt-api.moscow.alfaintra.net
profile: loading
cluster: "ufrulkltmaster1.moscow.alfaintra.net"
replicaCounter: 2
project:
  name: "ufr-eos-ul-ncins"
  service: "${project.name}-${serviceName}"
nodeSelector:
  node-role.kubernetes.io/node: ''
chartConfigMapFolder: "configMap"
podAdditionalLabels:
  networking.kubernetes.io/bitbucket: enabled
  networking.kubernetes.io/ufr-ui-loadbalancer: enabled
  networking.kubernetes.io/ufr-api-loadbalancer: enabled
  networking.kubernetes.io/ufr-ulk-api-loadbalancer: enabled
  networking.kubernetes.io/ufr-ulk-ui-loadbalancer: enabled
  networking.kubernetes.io/common-services: enabled
  networking.kubernetes.io/client-session: enabled
  networking.kubernetes.io/keycloak: enabled
  networking.kubernetes.io/kafka-sfa: enabled
  networking.kubernetes.io/ump: enabled
  networking.kubernetes.io/redis-common: enabled
  networking.kubernetes.io/redis-keycloak: enabled
serviceAdditionalLabels:
  tier: backend
configMap:
  - name: "${project.name}-${serviceName}"
    files:
      - "application.yml"
      - "${project.service}.yml"
containers:
  registry: eco.binary.alfabank.ru
  image: "ufr-access-checker"
  runAsUser: 0
  ports:
    - name: http
      protocol: TCP
      servicePort: 80
      containerPort: 8080
    - name: prometheus
      protocol: TCP
      servicePort: 8081
      containerPort: 8081
  secrets:
    - name: "alfabank-trustca-secret"
      mountPath: "/ssl/trustca"
      permissions: "444"
    - name: "ufr-truststore-jks"
      mountPath: "/data/ssl/CAs/"
      permissions: "420"
  envs:
    type: "java"
    enabledDefaults: true
    envFrom:
      - secretRef:
          name: "redis-common"
      - secretRef:
          name: "redis-keycloak"
      - secretRef:
          name: "kafka-bank-wide"
      - secretRef:
          name: "keycloak"
      - secretRef:
          name: "access-checker"
  configMaps:
    - name: "${project.name}-${serviceName}"
      mountPath: /configs
  env:
    JAVA_OPTS: "-server -Xmx512M -Xms512M -Xss1024K -XX:MaxMetaspaceSize=128M
                        -Djavax.net.ssl.trustStore=/data/ssl/CAs/ufrTrustStore.jks
                        -Djavax.net.ssl.trustStorePassword=
                        -Djavax.net.ssl.trustStoreType=JKS
                        -Duser.timezone=Europe/Moscow
                        -XX:+AlwaysActAsServerClassMachine
                        -XX:+PrintFlagsFinal
                        -XX:+ExitOnOutOfMemoryError"
    SERVICE_HOST: "${serviceHost}"
    ENABLE_PROMETHEUS: "true"
    SPRINGDOC_API_DOCS_ENABLED: "false"
    SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/configs/application.yml, file:/configs/${project.service}.yml"
    PROJECT_KEY: "${project.name}"
    SERVICE_NAME: "${project.service}"
    SPRING_APPLICATION_NAME: "${project.service}"
    SPRING_PROFILES_ACTIVE: "${profile},kubernetes"
    SPRING_CLOUD_CONFIG_ENABLED: "false"
    XDG_CONFIG_HOME: "/app/resources/config"
    SERVICE_WHITE_LIST: "ufr-eos-ul-ncins-core-api,ufr-eos-ul-ncins-module-info-api,ufr-eos-ul-ncins-access-checker,ufr-eos-ul-ncins-ui"
    GIT_ENABLED: "true"
    CONFIG_FILES: "configMap/application.yml, configMap/ufr-eos-ul-ncins-access-checker.yml"
    TZ: "Europe/Moscow"
  resources:
    requests:
      cpu: "100m"
      memory: "1024Mi"
    limits:
      cpu: "500m"
      memory: "1536Mi"
  probes:
    startupProbe:
      httpGet:
        path: /admin/health
        port: http
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 3
    livenessProbe:
      httpGet:
        path: /admin/health
        port: http
      initialDelaySeconds: 60
      failureThreshold: 5
      periodSeconds: 30
      timeoutSeconds: 3
    readinessProbe:
      httpGet:
        path: /admin/health
        port: http
      initialDelaySeconds: 30
      failureThreshold: 3
      periodSeconds: 20
      timeoutSeconds: 3
prometheus:
  enabled: true
  path: /admin/prometheus
  port: prometheus